[project]
name = "nn-trainer"
version = "1.1.1"
description = ""
authors = [
    {name = "Kai Sugahara",email = "contact@kais.jp"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
license="Apache-2.0"
dependencies = [
    "jax (>=0.8.2,<0.9.0)",
    "flax (>=0.12.2,<0.13.0)",
    "optax (>=0.2.6,<0.3.0)",
    "polars (>=1.36.1,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "mlflow (>=2.21.3,<3.0.0)",
    "torch (>=2.6.0,<3.0.0)"
]

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"
ruff = "^0.14.10"
scikit-learn = "^1.8.0"

[project.optional-dependencies]
cuda13 = ["jax[cuda13] (>=0.8.2,<0.9.0)"]
tpu = ["jax[tpu] (>=0.8.2,<0.9.0)"]
metal = ["jax-metal (>=0.1.1,<0.2.0)"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
